services:
  - type: web
    name: pbl-chat-backend
    runtime: docker
    rootDir: PBL-backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: chat_app
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
      - key: JWT_EXPIRATION
        value: "86400000"
